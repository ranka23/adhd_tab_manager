<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!--
    ADHD Tab Manager — logo (2026 refresh)
    A gradient squircle tile with a calm white brain mark (the extension's
    focus-on-your-brain identity) and a warm "spark of focus" accent.
    Brain glyph adapted from Lucide's "brain" icon (ISC License).
    Rasterized to public/icons/icon{16,32,48,128}.png by scripts/generate-icons.mjs.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bg)"/>
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#glow)"/>
  <rect x="10.5" y="10.5" width="107" height="107" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>

  <!-- brain mark (centered with even ~19px breathing room from the tile on
       all sides; the glyph's bottom arcs bulge lower than its nominal 24×24
       box, which the centering accounts for) -->
  <g fill="#ffffff" transform="translate(10 10) scale(4.5)">
    <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
    <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
    <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/>
    <path d="M17.599 6.5a3 3 0 0 0 .399-1.375"/>
    <path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/>
    <path d="M3.477 10.896a4 4 0 0 1 .585-.396"/>
    <path d="M19.938 10.5a4 4 0 0 1 .585.396"/>
    <path d="M6 18a4 4 0 0 1-1.967-.516"/>
    <path d="M19.967 17.484A4 4 0 0 1 18 18"/>
  </g>

  <!-- spark of focus -->
  <g transform="rotate(14 97 30)">
    <path d="M97 19c1.1 7.6 5 11.5 12.6 12.6-7.6 1.1-11.5 5-12.6 12.6-1.1-7.6-5-11.5-12.6-12.6 7.6-1.1 11.5-5 12.6-12.6Z" fill="url(#spark)"/>
  </g>
</svg>
